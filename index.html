<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nix Salas FF</title><link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="login" class="center"><div class="card login"><h1>🎮 Nix Salas FF</h1><p>Painel privado</p>
<input id="loginPass" type="password" placeholder="Senha do painel"><button onclick="login()">Entrar</button><div id="loginMsg"></div></div></div>
<div id="app" hidden><header><div><h1>🎮 Nix Salas FF</h1><small>Gerenciador de salas</small></div><button class="ghost" onclick="logout()">Sair</button></header>
<main>
<section class="card"><h2>Configuração segura</h2><p>O token fica somente no backend e é armazenado criptografado com AES-256-GCM.</p>
<div class="row"><input id="apiToken" type="password" placeholder="Cole o token da Nix API"><button onclick="saveToken()">Salvar token</button></div><span id="tokenStatus"></span></section>
<section class="grid">
<div class="card"><h2>Criar sala</h2>
<label>Modo<select id="mode" onchange="modeChanged()"><option value="ap_padrao">AP padrão</option><option value="gelo_inf">Gelo infinito</option><option value="tatico">Tático</option><option value="ap_fullcapa">AP Full Capa</option><option value="capa_3">Capa 3</option><option value="ap_uxd">AP UXD</option><option value="ap_7r">AP 7R</option><option value="br_padrao">Battle Royale</option></select></label>
<label>Nome<input id="roomName" value="Sala Nix"></label>
<label>Senha da sala<input id="roomPass" value="123456" maxlength="16"></label>
<label>Mapa<select id="map"><option>Bermuda</option><option>Purgatory</option><option>Kalahari</option><option>Nextera</option><option>Nova Terra</option><option>Solara</option></select></label>
<label>Atraso (min)<input id="delay" type="number" min="1" max="20" value="10"></label>
<div id="brFields" hidden><label>Equipe<select id="team"><option value="solo">Solo</option><option value="duo">Duo</option><option value="squad">Squad</option></select></label>
<label>Espectadores<select id="spec"><option>30</option><option>16</option><option>8</option><option>6</option><option>4</option><option>2</option><option>1</option></select></label></div>
<button onclick="createRoom()">➕ Criar sala</button><pre id="createOut"></pre></div>
<div class="card"><h2>Sala atual</h2><label>Session ID<input id="session" placeholder="Aparece ao criar"></label>
<div class="actions"><button onclick="loadMembers()">👥 Jogadores</button><button onclick="startRoom()">▶️ Iniciar</button><button onclick="result()">🏆 Resultado</button><button class="danger" onclick="releaseRoom()">Encerrar</button></div>
<div id="roomInfo"></div><div id="members"></div><pre id="resultOut"></pre></div>
</section>
<section class="card"><h2>Saldo</h2><button onclick="balance()">Atualizar</button><pre id="balanceOut"></pre></section>
</main></div>
<script src="/app.js"></script></body></html>
